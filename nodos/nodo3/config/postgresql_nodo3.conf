listen_addresses = '*'
port = 5432

# Nodo 3 es solo subscriber (destino final), no publica hacia nadie mas,
# asi que no necesita wal_level = logical como Nodo 1 / Nodo 2.
# Los valores por defecto de PostgreSQL para workers de replicacion logica
# (max_logical_replication_workers, max_sync_workers_per_subscription)
# son suficientes para 2 suscripciones.
